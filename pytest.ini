[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    data
    venv
    .venv
    node_modules
    .git
    __pycache__