name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env: 
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northstar_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d northstar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/northstar_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/northstar_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5434/northstar_test
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: dummy
      OPENAI_API_KEY: dummy
      USE_LOCAL_LLM: "False"
      DUMMY_PASSWORD_HASH: "$argon2id$v=19$m=65536,t=3,p=4$Dl6O1U7CFD0xxEtSyGcWnA$Ak+8peIXDOF1VZn++BfzIncyN4W2Xm0Imje40Q1P2fw"
      JWT_SECRET_KEY: "38xpfVTjlWmDpBgv7HoSl-JkGP-c8z7q-hxEZtmIiJf7UjGNo_1uU7TLiIXRblYf359E8rRbLNxgTWuK-HC1yQ"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx asyncpg

      - name: Run tests
        run: pytest
